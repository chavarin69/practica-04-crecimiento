<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 03 - Agave Azul 3D</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Import Map para Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- Panel de Controles HTML -->
    <div id="controls-panel">
        <h1>Simulador de Agave Azul</h1>
        
        <div class="control-group">
            <button id="btn-anim">Pausar Viento</button>
            <button id="btn-camera">Reiniciar Cámara</button>
            <button id="btn-color-leaves">Simular Sequía (Color Pencas)</button>
            <button id="btn-toggle-leaves">Ocultar Pencas</button>
        </div>

        <div class="control-group">
            <label for="light-slider">Intensidad del Sol:</label>
            <input type="range" id="light-slider" min="0" max="3" step="0.1" value="1.5">
        </div>
    </div>

    <!-- Panel de Información (Raycasting) -->
    <div id="info-panel" class="hidden">
        <h2 id="info-name">Nombre de la Parte</h2>
        <div class="info-body">
            <p><strong>Geometría:</strong> <span id="info-type">---</span></p>
            <p><strong>Altura:</strong> <span id="info-height">---</span></p>
            <p><strong>Descripción:</strong> <span id="info-desc">---</span></p>
        </div>
    </div>

    <!-- Script principal -->
    <script type="module" src="main.js"></script>
</body>
</html>
